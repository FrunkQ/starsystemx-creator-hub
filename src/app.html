<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <!-- THE CHART ROOM SKIN (static/skin/chart-room.css): typefaces, colours, light and Night chart.
         Before the page's own CSS, so every hub variable has a value on the first paint. The body
         face is preloaded because it is the one every page shows; the others swap in. -->
    <link rel="preload" href="/skin/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/skin/chart-room.css" />
    <!-- A REMEMBERED CHOICE, APPLIED BEFORE THE FIRST PAINT. Without this a visitor who chose Night
         chart on a light-mode device would see a flash of paper on every page. Storage can be
         refused (private windows); then the device's own setting stands, which is the default. -->
    <script>
      try {
        var t = localStorage.getItem('sx-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
